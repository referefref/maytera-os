# scope.conf - path prefixes dup-const-lint does NOT read.
#
# ONE rule for what belongs here: WE DO NOT OWN THE FILE. A vendored upstream
# defining BLOCK_SIZE differently from our kernel is not our bug and we are not
# going to fix it by editing someone else's tree; flagging it only trains people
# to ignore the gate.
#
# It is NOT a place to park our own inconvenient duplicates. Those go in
# allowlist.tsv, per name, with a reason, where they stay visible.
#
# Every prefix here must EXIST under the scanned root or --strict FAILS. A stale
# exclusion silently changes what the gate covers, and this tree has been bitten
# by stale rulebook entries more than once (invariant-gate's allowlist,
# repo-guard's KNOWN_STALE_LAUNCH, which printed a falsehood for weeks).
#
# userland/libc is deliberately ABSENT even though components.tsv lists it: it is
# ours, it is where syscall.h lives, and excluding it would blind the gate to the
# exact #745 kernel-header-vs-libc divergence.

