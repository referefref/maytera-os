<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MayteraOS Office launcher icon: Sheets, the suite's spreadsheet
       (/APPS/SHEETS; the Start-menu label is "Sheets", CALC.ICN already belongs
       to the Calculator). Original MayteraOS artwork. Family sheet + mountain-M
       cue; Sheets = green table: filled header row over a 3x3 cell lattice. -->
  <rect x="11" y="5" width="42" height="54" rx="3" ry="3" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="19,20 25,12.5 32,19 39,12.5 45,20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#3fd17a">
    <rect x="19" y="27" width="26" height="6" rx="1"/>
    <rect x="19" y="36" width="26" height="3.2"/>
    <rect x="19" y="43" width="26" height="3.2"/>
    <rect x="19" y="50" width="26" height="3.2"/>
    <rect x="27" y="33" width="3.2" height="20"/>
    <rect x="36" y="33" width="3.2" height="20"/>
  </g>
</svg>
