<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- MayteraOS Writer toolbar icon: insert-image. Original artwork (GPLv2, same as the OS).
       Authored on a 16-cell pixel grid, 1-cell stroke; the group maps cell k to
       0.75 + 1.5k so the stroke is 1.5 viewBox units. White on transparent: the
       toolbar tints it (draw_mico luminance-as-coverage). -->
  <g transform="translate(0.75 0.75) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h12v10H2z"/>
    <path d="M2 12.5L6 8l3 3 1.5-1.5 3.5 3"/>
    <circle cx="10.5" cy="6" r="1.15" fill="#ffffff" stroke="none"/>
  </g>
</svg>
