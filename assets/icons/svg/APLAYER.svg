<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- #123 item 6, USER-REPORTED: "the music player icon needs to be flipped
       horizontally". CoreUI's cil-music-note draws the note with its HEAD at
       the bottom RIGHT and the flag at the top LEFT; the conventional quaver
       (and every other music-note glyph this desktop shows) has the head at
       the bottom LEFT with the flag reaching up and to the RIGHT. This is the
       only edit: a mirror about the viewBox's vertical centre line, applied as
       a transform on a wrapping <g> so the upstream PATH DATA below is still
       byte-for-byte CoreUI's, per assets/icons/README.md's "take the upstream
       path geometry and viewBox unmodified, recolor only" rule. No stroke,
       fill, viewBox or coordinate was touched.

       The SHIPPED raster /ICONS/APLAYER.ICN was NOT re-rasterized from this
       file. A horizontal mirror of a raster is exact (a pure pixel
       permutation, no resampling), whereas re-running the icon through a
       different renderer than the one that produced the shipped set would
       re-derive every antialiased edge and risk a visibly different weight.
       So the .ICN was mirrored directly, pixel for pixel, and this file is
       kept in step so a future regeneration reproduces the same result. -->
  <g transform="translate(512,0) scale(-1,1)">
    <path fill="#ffffff" d="m72 203.517 160-32v209.669h.044Q232 382.588 232 384c0 55.794 48.448 101.186 108 101.186S448 439.794 448 384s-48.448-101.186-108-101.186a111.43 111.43 0 0 0-76 29.367V28.483l-192 38.4Zm268 111.3c41.906 0 76 31.037 76 69.186s-34.094 69.186-76 69.186-76-31.04-76-69.189 34.094-69.186 76-69.186Zm-236-221.7 128-25.6v71.366l-128 25.6Z" class="ci-primary"/>
  </g>
</svg>
