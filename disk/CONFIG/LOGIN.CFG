# MayteraOS login configuration.
#
# THIS BUILD SHIPS NO ACCOUNTS AND NO DEFAULT PASSWORDS.
#
# create_defaults() in kernel/proc/users.c, the function that used to mint
# root/root and admin/admin, is compiled out unless MAYTERA_SHIP_DEFAULT_ACCOUNTS
# is defined, and no Makefile or script in this repository defines it. A fresh
# install therefore boots with an empty user database.
#
# What happens on first boot, with zero accounts:
#   login_run() (kernel/gui/login.c) finds users_count_active() == 0 and enters
#   LOGIN_STATE_CREATE_ACCOUNT, the first-boot account-creation screen. The
#   username and password you type there are passed to users_create_first_admin()
#   (kernel/proc/users.c), which hashes the password with PBKDF2 and creates the
#   administrator account, uid 0. Nothing is preset for you to guess.
#   The compositor separately launches the setup wizard, /APPS/SETUP, when
#   /CONFIG/SETUPDONE is absent.
#
# autologin=<username> signs that user in automatically and goes straight to the
# desktop, skipping the login screen entirely. It is DISABLED below, and you
# should think before enabling it: it is an authentication bypass by design.
#
# It is commented out rather than deleted so the key stays discoverable. Note
# that login_check_autologin() runs BEFORE the zero-account check, so an
# autologin line naming an account that later comes to exist would silently turn
# every subsequent boot into an unauthenticated sign-in as that user. On a build
# with no accounts the line resolves to nothing and is merely inert; the risk is
# what it does after you create an account with a matching name.
#
# Enable it only for an unattended machine where that is what you want, for
# example a kiosk, a CI runner or a throwaway VM, and only naming an account you
# have actually created:
#
#   autologin=yourusername
#
# Deleting this file entirely is also fine; it is optional.
